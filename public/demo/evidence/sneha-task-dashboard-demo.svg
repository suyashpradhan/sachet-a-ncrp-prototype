<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic task platform dashboard</title>
  <desc id="desc">A fake task platform showing a displayed value of eighty thousand rupees and an unavailable withdrawal.</desc>
  <rect width="720" height="460" fill="#f8f7f5"/>
  <rect x="36" y="24" width="648" height="412" rx="18" fill="#fff" stroke="#ded9d7"/>
  <rect x="36" y="24" width="648" height="58" rx="18" fill="#242424"/>
  <rect x="36" y="64" width="648" height="18" fill="#242424"/>
  <text x="62" y="59" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Task Rewards</text>
  <text x="656" y="58" text-anchor="end" fill="#fbe5e7" font-family="Arial, sans-serif" font-size="11">SYNTHETIC PLATFORM</text>
  <text x="64" y="126" fill="#626262" font-family="Arial, sans-serif" font-size="14">Displayed task value</text>
  <text x="64" y="174" fill="#171717" font-family="Arial, sans-serif" font-size="40" font-weight="700">₹80,000</text>
  <rect x="64" y="205" width="592" height="76" rx="10" fill="#fff5f5" stroke="#e6b9bd"/>
  <text x="84" y="236" fill="#711522" font-family="Arial, sans-serif" font-size="16" font-weight="700">Withdrawal unavailable</text>
  <text x="84" y="260" fill="#626262" font-family="Arial, sans-serif" font-size="13">Complete the next deposit task to unlock withdrawal.</text>
  <g font-family="Arial, sans-serif">
    <text x="64" y="326" fill="#626262" font-size="13">Important evidence note</text>
    <text x="64" y="353" fill="#171717" font-size="15">This is a number shown inside the platform.</text>
    <text x="64" y="377" fill="#171717" font-size="15">It is not proof that money was credited to a bank or wallet.</text>
  </g>
  <rect x="64" y="395" width="196" height="26" rx="6" fill="#f1efed"/>
  <text x="162" y="413" text-anchor="middle" fill="#626262" font-family="Arial, sans-serif" font-size="11" font-weight="700">NO MATCHING CREDIT FOUND</text>
</svg>
