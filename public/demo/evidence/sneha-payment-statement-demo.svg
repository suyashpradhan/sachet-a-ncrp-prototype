<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" aria-labelledby="title desc" role="img" viewBox="0 0 720 460"><title id="title">Synthetic payment statement summary</title><desc id="desc">A synthetic statement showing sixty thousand rupees debited, five thousand credited, and a net loss of fifty-five thousand.</desc><rect width="720" height="460" fill="#f8f7f5"/><rect width="652" height="410" x="34" y="25" fill="#fff" stroke="#ded9d7" rx="16"/><text x="64" y="64" fill="#171717" font-family="Arial, sans-serif" font-size="22" font-weight="700">Payment statement summary</text><text x="64" y="86" fill="#626262" font-family="Arial, sans-serif" font-size="12">Synthetic matched bank and payment evidence</text><line x1="64" x2="656" y1="106" y2="106" stroke="#ded9d7"/><g font-family="Arial, sans-serif" font-size="14"><text x="64" y="137" fill="#626262">Reference</text><text x="278" y="137" fill="#626262">Direction</text><text x="430" y="137" fill="#626262">Amount</text><line x1="64" x2="656" y1="151" y2="151" stroke="#eeeae8"/><text x="64" y="180" fill="#171717">SYN-DB-05000</text><text x="278" y="180" fill="#861827">Debit</text><text x="430" y="180" fill="#171717">₹5,000</text><text x="64" y="215" fill="#171717">SYN-DB-15000</text><text x="278" y="215" fill="#861827">Debit</text><text x="430" y="215" fill="#171717">₹15,000</text><text x="64" y="250" fill="#171717">SYN-DB-40000</text><text x="278" y="250" fill="#861827">Debit</text><text x="430" y="250" fill="#171717">₹40,000</text><text x="64" y="285" fill="#171717">Matched task commissions</text><text x="278" y="285" fill="#237a4b">Credit</text><text x="430" y="285" fill="#171717">₹5,000</text></g><rect width="592" height="86" x="64" y="318" fill="#fff5f5" stroke="#fbe5e7" rx="10"/><g font-family="Arial, sans-serif"><text x="84" y="346" fill="#626262" font-size="13">Evidence-supported calculation</text><text x="84" y="379" fill="#711522" font-size="24" font-weight="700">₹60,000 − ₹5,000 = ₹55,000</text></g><text x="650" y="421" fill="#861827" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">SYNTHETIC DEMO</text></svg>