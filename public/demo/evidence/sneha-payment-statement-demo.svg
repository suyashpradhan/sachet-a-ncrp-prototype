<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic payment statement summary</title>
  <desc id="desc">A synthetic statement showing two lakh eight thousand one hundred rupees debited, twenty-three thousand credited, and a net loss of one lakh eighty-five thousand one hundred.</desc>
  <rect width="720" height="460" fill="#f8f7f5"/>
  <rect x="34" y="25" width="652" height="410" rx="16" fill="#fff" stroke="#ded9d7"/>
  <text x="64" y="64" fill="#171717" font-family="Arial, sans-serif" font-size="22" font-weight="700">Payment statement summary</text>
  <text x="64" y="86" fill="#626262" font-family="Arial, sans-serif" font-size="12">Synthetic matched bank and payment evidence</text>
  <line x1="64" y1="106" x2="656" y2="106" stroke="#ded9d7"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="64" y="137" fill="#626262">Reference</text><text x="278" y="137" fill="#626262">Direction</text><text x="430" y="137" fill="#626262">Amount</text>
    <line x1="64" y1="151" x2="656" y2="151" stroke="#eeeae8"/>
    <text x="64" y="180" fill="#171717">SYN-DB-100000</text><text x="278" y="180" fill="#861827">Debit</text><text x="430" y="180" fill="#171717">₹1,00,000</text>
    <text x="64" y="215" fill="#171717">SYN-DB-72000</text><text x="278" y="215" fill="#861827">Debit</text><text x="430" y="215" fill="#171717">₹72,000</text>
    <text x="64" y="250" fill="#171717">Other matched deposits</text><text x="278" y="250" fill="#861827">Debit</text><text x="430" y="250" fill="#171717">₹36,100</text>
    <text x="64" y="285" fill="#171717">Matched commissions</text><text x="278" y="285" fill="#237a4b">Credit</text><text x="430" y="285" fill="#171717">₹23,000</text>
  </g>
  <rect x="64" y="318" width="592" height="86" rx="10" fill="#fff5f5" stroke="#fbe5e7"/>
  <g font-family="Arial, sans-serif">
    <text x="84" y="346" fill="#626262" font-size="13">Evidence-supported calculation</text>
    <text x="84" y="379" fill="#711522" font-size="24" font-weight="700">₹2,08,100 − ₹23,000 = ₹1,85,100</text>
  </g>
  <text x="650" y="421" text-anchor="end" fill="#861827" font-family="Arial, sans-serif" font-size="11" font-weight="700">SYNTHETIC DEMO</text>
</svg>
