<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" aria-labelledby="title desc" role="img" viewBox="0 0 720 460"><title id="title">Synthetic WhatsApp job conversation</title><desc id="desc">A fictional recruiter requests registration, verification and security-deposit payments.</desc><rect width="720" height="460" fill="#f8f7f5"/><rect width="640" height="388" x="40" y="36" fill="#fff" stroke="#ded9d7" rx="18"/><text x="72" y="82" fill="#171717" font-family="Arial,sans-serif" font-size="18" font-weight="700">WhatsApp conversation · Synthetic evidence</text><rect width="470" height="66" x="72" y="108" fill="#f2f0ed" rx="12"/><text x="92" y="147" fill="#171717" font-family="Arial,sans-serif" font-size="16">Pay ₹499 registration fee to continue.</text><rect width="470" height="66" x="72" y="190" fill="#f2f0ed" rx="12"/><text x="92" y="229" fill="#171717" font-family="Arial,sans-serif" font-size="16">Verification requires another ₹1,499.</text><rect width="536" height="66" x="72" y="272" fill="#fbe5e7" rx="12"/><text x="92" y="311" fill="#711522" font-family="Arial,sans-serif" font-size="16">Now pay ₹18,000 as a refundable security deposit.</text><text x="72" y="382" fill="#626262" font-family="Arial,sans-serif" font-size="14">Demo only · Number and conversation are fictional</text></svg>