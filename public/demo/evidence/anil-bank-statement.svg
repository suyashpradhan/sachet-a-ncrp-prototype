<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic bank statement</title><desc id="desc">A synthetic statement showing three debits and a reversal.</desc>
  <rect width="760" height="520" fill="#faf8f6"/><rect x="42" y="32" width="676" height="456" rx="16" fill="#fff" stroke="#e2ded9"/>
  <text x="76" y="80" font-family="Arial,sans-serif" font-size="18" fill="#6b6b6b">SYNTHETIC BANK STATEMENT</text><text x="76" y="116" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1f1f1f">Account ending 1930</text>
  <g font-family="Arial,sans-serif" font-size="16"><text x="76" y="171" fill="#6b6b6b">ENTRY</text><text x="550" y="171" fill="#6b6b6b">AMOUNT</text>
  <line x1="76" y1="187" x2="684" y2="187" stroke="#e2ded9"/>
  <text x="76" y="225" fill="#1f1f1f">Unauthorized debit · 3:07 PM</text><text x="550" y="225" fill="#1f1f1f">− ₹12,000</text>
  <text x="76" y="273" fill="#1f1f1f">Unauthorized debit · 3:09 PM</text><text x="550" y="273" fill="#1f1f1f">− ₹18,000</text>
  <text x="76" y="321" fill="#1f1f1f">Unauthorized debit · 3:11 PM</text><text x="550" y="321" fill="#1f1f1f">− ₹6,000</text>
  <text x="76" y="369" fill="#237a4b">Reversal credit · 3:18 PM</text><text x="550" y="369" fill="#237a4b">+ ₹6,000</text>
  <line x1="76" y1="397" x2="684" y2="397" stroke="#e2ded9"/><text x="76" y="439" fill="#6b6b6b">Current evidence-supported loss</text><text x="550" y="439" font-weight="700" fill="#1f1f1f">₹30,000</text></g>
</svg>
