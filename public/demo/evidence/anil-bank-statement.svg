<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 760 520"><title id="title">Synthetic bank statement</title><desc id="desc">A synthetic statement showing three debits and a reversal.</desc><rect width="760" height="520" fill="#faf8f6"/><rect width="676" height="456" x="42" y="32" fill="#fff" stroke="#e2ded9" rx="16"/><text x="76" y="80" fill="#6b6b6b" font-family="Arial,sans-serif" font-size="18">SYNTHETIC BANK STATEMENT</text><text x="76" y="116" fill="#1f1f1f" font-family="Arial,sans-serif" font-size="24" font-weight="700">Account ending 1930</text><g font-family="Arial,sans-serif" font-size="16"><text x="76" y="171" fill="#6b6b6b">ENTRY</text><text x="550" y="171" fill="#6b6b6b">AMOUNT</text><line x1="76" x2="684" y1="187" y2="187" stroke="#e2ded9"/><text x="76" y="225" fill="#1f1f1f">Unauthorized debit · 3:07 PM</text><text x="550" y="225" fill="#1f1f1f">− ₹12,000</text><text x="76" y="273" fill="#1f1f1f">Unauthorized debit · 3:09 PM</text><text x="550" y="273" fill="#1f1f1f">− ₹18,000</text><text x="76" y="321" fill="#1f1f1f">Unauthorized debit · 3:11 PM</text><text x="550" y="321" fill="#1f1f1f">− ₹6,000</text><text x="76" y="369" fill="#237a4b">Reversal credit · 3:18 PM</text><text x="550" y="369" fill="#237a4b">+ ₹6,000</text><line x1="76" x2="684" y1="397" y2="397" stroke="#e2ded9"/><text x="76" y="439" fill="#6b6b6b">Current evidence-supported loss</text><text x="550" y="439" fill="#1f1f1f" font-weight="700">₹30,000</text></g></svg>