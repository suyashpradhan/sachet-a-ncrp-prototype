<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" aria-labelledby="title desc" role="img" viewBox="0 0 720 460"><title id="title">Synthetic LinkedIn job conversation</title><desc id="desc">A fictional recruiter moves a job conversation to WhatsApp.</desc><rect width="720" height="460" fill="#f8f7f5"/><rect width="640" height="388" x="40" y="36" fill="#fff" stroke="#ded9d7" rx="18"/><text x="72" y="82" fill="#171717" font-family="Arial,sans-serif" font-size="18" font-weight="700">LinkedIn conversation · Synthetic evidence</text><rect width="438" height="78" x="72" y="112" fill="#f2f0ed" rx="12"/><text x="92" y="143" fill="#171717" font-family="Arial,sans-serif" font-size="16">We saw your profile and have a job opening.</text><text x="92" y="169" fill="#171717" font-family="Arial,sans-serif" font-size="16">Please continue with our recruiter on WhatsApp.</text><rect width="438" height="62" x="210" y="216" fill="#fff5f5" rx="12"/><text x="230" y="253" fill="#171717" font-family="Arial,sans-serif" font-size="16">Okay, please share the role details.</text><text x="72" y="382" fill="#626262" font-family="Arial,sans-serif" font-size="14">Demo only · No real account or person</text></svg>