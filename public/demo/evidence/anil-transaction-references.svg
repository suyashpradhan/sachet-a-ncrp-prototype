<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" aria-labelledby="title desc" role="img" viewBox="0 0 760 460"><title id="title">Synthetic transaction references</title><desc id="desc">Synthetic reference numbers preserved for the Sachet demo.</desc><rect width="760" height="460" fill="#faf8f6"/><rect width="664" height="388" x="48" y="36" fill="#fff" stroke="#e2ded9" rx="16"/><text x="82" y="83" fill="#6b6b6b" font-family="Arial,sans-serif" font-size="18">TRANSACTION REFERENCES · SYNTHETIC</text><g font-family="Arial,sans-serif"><text x="82" y="137" fill="#6b6b6b" font-size="17">₹12,000 debit</text><text x="330" y="137" fill="#1f1f1f" font-size="17" font-weight="700">SYN-ANIL-12000-01</text><text x="82" y="197" fill="#6b6b6b" font-size="17">₹18,000 debit</text><text x="330" y="197" fill="#1f1f1f" font-size="17" font-weight="700">SYN-ANIL-18000-02</text><text x="82" y="257" fill="#6b6b6b" font-size="17">₹6,000 debit</text><text x="330" y="257" fill="#1f1f1f" font-size="17" font-weight="700">SYN-ANIL-6000-03</text><text x="82" y="317" fill="#237a4b" font-size="17">₹6,000 reversal</text><text x="330" y="317" fill="#237a4b" font-size="17" font-weight="700">SYN-ANIL-REV-6000</text><line x1="82" x2="678" y1="350" y2="350" stroke="#e2ded9"/><text x="82" y="388" fill="#a61e2d" font-size="15">Demo records only · no real bank is connected</text></g></svg>