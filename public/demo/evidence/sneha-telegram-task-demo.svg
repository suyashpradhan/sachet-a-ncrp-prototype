<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Telegram task conversation</title>
  <desc id="desc">A synthetic Telegram conversation asking for larger deposits and later demanding twenty-five thousand rupees.</desc>
  <rect width="720" height="460" fill="#f8f7f5"/>
  <rect x="36" y="24" width="648" height="412" rx="18" fill="#fff" stroke="#ded9d7"/>
  <rect x="36" y="24" width="648" height="62" rx="18" fill="#242424"/>
  <rect x="36" y="68" width="648" height="18" fill="#242424"/>
  <circle cx="72" cy="55" r="16" fill="#fff5f5"/>
  <text x="101" y="53" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Task coordinator</text>
  <text x="101" y="71" fill="#fbe5e7" font-family="Arial, sans-serif" font-size="12">Synthetic Telegram / task conversation</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#171717">
    <rect x="62" y="112" width="470" height="62" rx="10" fill="#f1efed"/>
    <text x="79" y="137">Deposit more to receive larger rating tasks.</text>
    <text x="79" y="158" fill="#626262">Each completed task increases your dashboard value.</text>
    <rect x="238" y="198" width="420" height="58" rx="10" fill="#fff5f5" stroke="#fbe5e7"/>
    <text x="255" y="222">I have made the requested payments.</text>
    <text x="255" y="243" fill="#626262">Why can’t I withdraw the balance?</text>
    <rect x="62" y="282" width="556" height="66" rx="10" fill="#f1efed"/>
    <text x="79" y="306" font-weight="700">Deposit another ₹25,000 to unlock withdrawal.</text>
    <text x="79" y="329" fill="#626262">This is the final task requirement.</text>
    <rect x="238" y="370" width="420" height="42" rx="10" fill="#fff5f5" stroke="#e6b9bd"/>
    <text x="255" y="396" font-weight="700">I did not pay this amount.</text>
  </g>
  <text x="665" y="425" text-anchor="end" fill="#861827" font-family="Arial, sans-serif" font-size="11" font-weight="700">SYNTHETIC DEMO</text>
</svg>
