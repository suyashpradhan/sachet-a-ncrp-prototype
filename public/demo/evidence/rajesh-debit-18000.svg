<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic eighteen thousand rupee debit alert</title><desc id="desc">A synthetic bank SMS showing an unauthorized debit of eighteen thousand rupees.</desc>
  <rect width="720" height="460" fill="#faf8f6"/><rect x="62" y="50" width="596" height="360" rx="18" fill="#fff" stroke="#e2ded9"/>
  <text x="96" y="99" font-family="Arial,sans-serif" font-size="18" fill="#6b6b6b">SYNTHETIC BANK SMS</text>
  <rect x="96" y="132" width="528" height="184" rx="14" fill="#f7f4f1"/>
  <text x="122" y="179" font-family="Arial,sans-serif" font-size="17" fill="#6b6b6b">Debit alert</text>
  <text x="122" y="226" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1f1f1f">₹18,000</text>
  <text x="122" y="265" font-family="Arial,sans-serif" font-size="16" fill="#1f1f1f">Account 12345678906400 · 3 Sep · 6:50 PM</text>
  <text x="96" y="338" font-family="Arial,sans-serif" font-size="16" fill="#6b6b6b">Reference  SYN-RAJESH-18000-02</text>
  <text x="96" y="367" font-family="Arial,sans-serif" font-size="15" fill="#6b6b6b">Available balance ₹84,221</text>
  <text x="96" y="397" font-family="Arial,sans-serif" font-size="14" fill="#a61e2d">Synthetic evidence · no bank system connected</text>
</svg>
