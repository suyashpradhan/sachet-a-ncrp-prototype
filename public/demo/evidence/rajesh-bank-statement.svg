<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" aria-labelledby="title desc" role="img" viewBox="0 0 720 460"><title id="title">Synthetic bank statement</title><desc id="desc">A synthetic statement showing two unauthorized debits totalling thirty thousand rupees.</desc><rect width="720" height="460" fill="#faf8f6"/><rect width="624" height="388" x="48" y="36" fill="#fff" stroke="#e2ded9" rx="16"/><text x="82" y="80" fill="#6b6b6b" font-family="Arial,sans-serif" font-size="18">SYNTHETIC BANK STATEMENT</text><text x="82" y="116" fill="#1f1f1f" font-family="Arial,sans-serif" font-size="23" font-weight="700">Account ending 6400</text><line x1="82" x2="638" y1="145" y2="145" stroke="#e2ded9"/><g font-family="Arial,sans-serif"><text x="82" y="184" fill="#6b6b6b" font-size="16">3 Sep · 6:47 PM</text><text x="292" y="184" fill="#1f1f1f" font-size="16">Unauthorized debit</text><text x="540" y="184" fill="#1f1f1f" font-size="17" font-weight="700">− ₹12,000</text><text x="82" y="234" fill="#6b6b6b" font-size="16">3 Sep · 6:50 PM</text><text x="292" y="234" fill="#1f1f1f" font-size="16">Unauthorized debit</text><text x="540" y="234" fill="#1f1f1f" font-size="17" font-weight="700">− ₹18,000</text><line x1="82" x2="638" y1="270" y2="270" stroke="#e2ded9"/><text x="82" y="316" fill="#6b6b6b" font-size="17">Total confirmed loss</text><text x="526" y="316" fill="#1f1f1f" font-size="24" font-weight="700">₹30,000</text><text x="82" y="369" fill="#a61e2d" font-size="14">Synthetic evidence · no bank system connected</text></g></svg>