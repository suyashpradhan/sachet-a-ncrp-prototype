<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic bank statement</title><desc id="desc">A synthetic statement showing two unauthorized debits totalling thirty thousand rupees.</desc>
  <rect width="720" height="460" fill="#faf8f6"/><rect x="48" y="36" width="624" height="388" rx="16" fill="#fff" stroke="#e2ded9"/>
  <text x="82" y="80" font-family="Arial,sans-serif" font-size="18" fill="#6b6b6b">SYNTHETIC BANK STATEMENT</text>
  <text x="82" y="116" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1f1f1f">Account ending 6400</text>
  <line x1="82" y1="145" x2="638" y2="145" stroke="#e2ded9"/>
  <g font-family="Arial,sans-serif"><text x="82" y="184" font-size="16" fill="#6b6b6b">3 Sep · 6:47 PM</text><text x="292" y="184" font-size="16" fill="#1f1f1f">Unauthorized debit</text><text x="540" y="184" font-size="17" font-weight="700" fill="#1f1f1f">− ₹12,000</text>
  <text x="82" y="234" font-size="16" fill="#6b6b6b">3 Sep · 6:50 PM</text><text x="292" y="234" font-size="16" fill="#1f1f1f">Unauthorized debit</text><text x="540" y="234" font-size="17" font-weight="700" fill="#1f1f1f">− ₹18,000</text>
  <line x1="82" y1="270" x2="638" y2="270" stroke="#e2ded9"/>
  <text x="82" y="316" font-size="17" fill="#6b6b6b">Total confirmed loss</text><text x="526" y="316" font-size="24" font-weight="700" fill="#1f1f1f">₹30,000</text>
  <text x="82" y="369" font-size="14" fill="#a61e2d">Synthetic evidence · no bank system connected</text></g>
</svg>
