<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="t" role="img" viewBox="0 0 720 480"><title id="t">Synthetic threat email</title><rect width="720" height="480" fill="#f8f7f5"/><rect width="612" height="390" x="54" y="45" fill="#fff" stroke="#ded9d7" rx="18"/><text x="88" y="96" fill="#711522" font-family="Arial,sans-serif" font-size="20">SYNTHETIC EMAIL</text><text x="88" y="146" fill="#171717" font-family="Arial,sans-serif" font-size="25" font-weight="700">From: unknown.sender@example.invalid</text><line x1="88" x2="632" y1="180" y2="180" stroke="#ded9d7"/><text x="88" y="228" fill="#171717" font-family="Arial,sans-serif" font-size="21">The same threat was repeated by email.</text><rect width="440" height="18" x="88" y="268" fill="#292929" rx="4"/><rect width="350" height="18" x="88" y="302" fill="#292929" rx="4"/><text x="88" y="382" fill="#626262" font-family="Arial,sans-serif" font-size="17">Sensitive text redacted in the demo preview.</text></svg>