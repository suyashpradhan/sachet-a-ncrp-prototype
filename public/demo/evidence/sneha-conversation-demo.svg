<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" aria-labelledby="title desc" role="img" viewBox="0 0 720 460"><title id="title">Synthetic WhatsApp task offer</title><desc id="desc">A synthetic WhatsApp conversation offering part-time online tasks and small commissions.</desc><rect width="720" height="460" fill="#f8f7f5"/><rect width="648" height="412" x="36" y="24" fill="#fff" stroke="#ded9d7" rx="18"/><rect width="648" height="62" x="36" y="24" fill="#711522" rx="18"/><rect width="648" height="18" x="36" y="68" fill="#711522"/><circle cx="72" cy="55" r="16" fill="#fff5f5"/><text x="101" y="53" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Part-time task offer</text><text x="101" y="71" fill="#fbe5e7" font-family="Arial, sans-serif" font-size="12">Synthetic WhatsApp conversation</text><g fill="#171717" font-family="Arial, sans-serif" font-size="15"><rect width="416" height="58" x="62" y="112" fill="#f1efed" rx="10"/><text x="79" y="136">Complete simple rating tasks from home.</text><text x="79" y="157" fill="#626262">We pay a commission after each task.</text><rect width="420" height="58" x="238" y="190" fill="#fff5f5" stroke="#fbe5e7" rx="10"/><text x="255" y="214">I received the first small payments.</text><text x="255" y="235" fill="#626262">Where are the next tasks?</text><rect width="490" height="66" x="62" y="270" fill="#f1efed" rx="10"/><text x="79" y="294">Your first rating task is complete.</text><text x="79" y="317" fill="#237a4b">A small commission has been sent.</text><rect width="420" height="54" x="238" y="358" fill="#fff5f5" stroke="#e6b9bd" rx="10"/><text x="255" y="382" font-weight="700">I received it. What is the next task?</text><text x="255" y="402" fill="#626262">The early payout made the offer seem genuine.</text></g><text x="665" y="425" fill="#861827" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">SYNTHETIC DEMO</text></svg>