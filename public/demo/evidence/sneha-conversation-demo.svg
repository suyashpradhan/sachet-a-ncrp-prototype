<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic WhatsApp and Telegram task conversation</title>
  <desc id="desc">A synthetic conversation offering rating tasks, moving to Telegram, and later demanding ninety thousand rupees.</desc>
  <rect width="720" height="460" fill="#f8f7f5"/>
  <rect x="36" y="24" width="648" height="412" rx="18" fill="#fff" stroke="#ded9d7"/>
  <rect x="36" y="24" width="648" height="62" rx="18" fill="#711522"/>
  <rect x="36" y="68" width="648" height="18" fill="#711522"/>
  <circle cx="72" cy="55" r="16" fill="#fff5f5"/>
  <text x="101" y="53" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Part-time task group</text>
  <text x="101" y="71" fill="#fbe5e7" font-family="Arial, sans-serif" font-size="12">Synthetic conversation · WhatsApp → Telegram</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#171717">
    <rect x="62" y="112" width="416" height="58" rx="10" fill="#f1efed"/>
    <text x="79" y="136">Complete simple rating tasks from home.</text>
    <text x="79" y="157" fill="#626262">We pay a commission after each task.</text>
    <rect x="238" y="190" width="420" height="58" rx="10" fill="#fff5f5" stroke="#fbe5e7"/>
    <text x="255" y="214">I received the first small payments.</text>
    <text x="255" y="235" fill="#626262">Where are the next tasks?</text>
    <rect x="62" y="270" width="490" height="66" rx="10" fill="#f1efed"/>
    <text x="79" y="294">Join our Telegram group for larger tasks.</text>
    <text x="79" y="317" fill="#626262">Deposit first; your dashboard balance will increase.</text>
    <rect x="62" y="358" width="556" height="54" rx="10" fill="#fff5f5" stroke="#e6b9bd"/>
    <text x="79" y="382" font-weight="700">Deposit ₹90,000 to unlock withdrawal.</text>
    <text x="79" y="402" fill="#626262">Citizen status: not paid</text>
  </g>
  <text x="665" y="425" text-anchor="end" fill="#861827" font-family="Arial, sans-serif" font-size="11" font-weight="700">SYNTHETIC DEMO</text>
</svg>
